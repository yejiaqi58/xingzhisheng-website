<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>团队介绍 - 星之声科技有限公司</title>

  <!-- 粒子 + 3D 倾斜 -->
  <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanilla-tilt@1.7.0/dist/vanilla-tilt.min.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'SF Pro Display', 'Microsoft YaHei', sans-serif;
      background: #0a0a1a;
      color: #e0f7ff;
      overflow-x: hidden;
    }
    #particles-js {
      position: fixed;
      width: 100%;
      height: 100%;
      z-index: -1;
    }

    /* ============ 导航栏 ============ */
    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      padding: 18px 40px;
      background: rgba(10, 10, 30, 0.7);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(0, 212, 255, 0.2);
      z-index: 1000;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 {
      font-size: 1.6rem;
      font-weight: 500;
      background: linear-gradient(90deg, #00d4ff, #7b00ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    nav {
      display: flex;
      gap: 28px;
    }
    nav a {
      color: #88cfff;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      transition: all 0.3s;
    }
    nav a:hover {
      color: #00d4ff;
      text-shadow: 0 0 12px rgba(0, 212, 255, 0.8);
    }
    nav a.active {
      color: #00d4ff;
      text-shadow: 0 0 12px rgba(0, 212, 255, 0.8);
      font-weight: 600;
    }

    /* ============ 主容器 ============ */
    .container {
      margin-top: 80px;
      padding: 60px 40px;
      text-align: center;
    }
    .page-title {
      font-size: 3rem;
      font-weight: 200;
      margin-bottom: 60px;
      background: linear-gradient(90deg, #00d4ff, #7b00ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 6px;
    }

    /* ============ 团队网格 - 4×2 对称 ============ */
    .team-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 32px;
      max-width: 1400px;
      margin: 0 auto;
    }
    .team-member {
      background: rgba(15, 25, 60, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 212, 255, 0.2);
      border-radius: 24px;
      padding: 28px;
      text-align: center;
      transition: all 0.5s;
      opacity: 0;
      transform: translateY(30px);
    }
    .team-member.visible {
      opacity: 1;
      transform: translateY(0);
    }
    .team-member:hover {
      border-color: #00d4ff;
      box-shadow: 0 30px 60px rgba(0, 212, 255, 0.3);
      transform: translateY(-12px);
    }
    .team-member img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      margin-bottom: 20px;
      border: 3px solid rgba(0, 212, 255, 0.3);
      transition: all 0.4s;
      image-rendering: pixelated;
      image-rendering: -moz-crisp-edges;
      image-rendering: crisp-edges;
      object-fit: cover;
    }
    .team-member:hover img {
      border-color: #00d4ff;
      box-shadow: 0 0 30px rgba(0, 212, 255, 0.6);
    }
    .team-member h3 {
      font-size: 1.3rem;
      margin-bottom: 8px;
      color: #00d4ff;
    }
    .team-member p {
      font-size: 0.95rem;
      color: #88cfff;
    }

    .footer {
      text-align: center;
      padding: 60px 20px;
      color: #88cfff;
      font-size: 0.9rem;
      border-top: 1px solid rgba(0, 212, 255, 0.2);
      margin-top: 100px;
    }

    @media (max-width: 1200px) {
      .team-grid { grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 768px) {
      .team-grid { grid-template-columns: repeat(2, 1fr); gap: 24px; }
      .team-member img { width: 100px; height: 100px; }
      header { padding: 15px 20px; }
      nav { gap: 15px; flex-wrap: wrap; justify-content: center; }
    }
  </style>
</head>
<body>

  <!-- 粒子背景 -->
  <div id="particles-js"></div>

  <!-- 导航栏 -->
  <header>
    <h1>星之声科技</h1>
    <nav>
      <a href="index.html">主页</a>
      <a href="about.html">关于我们</a>
      <a href="vision.html">愿景使命</a>
      <a href="industry.html">产业布局</a>
      <a href="services.html">服务解决方案</a>
      <a href="partners.html">合作伙伴</a>
      <a href="team.html">团队介绍</a>
      <a href="device.html" >设备介绍</a>
      <a href="contact.html">联系我们</a>
    </nav>
  </header>

  <!-- 主内容 -->
  <div class="container">
    <h1 class="page-title">核心团队</h1>

    <div class="team-grid">
      <!-- 叶家琪 -->
      <div class="team-member" data-tilt>
        <img src="images/yejiaqi.gif" alt="叶家琪">
        <h3>叶家琪</h3>
        <p>首席执行官 (CEO)</p>
      </div>

      <!-- 洪发 -->
      <div class="team-member" data-tilt>
        <img src="images/hongfa.gif" alt="洪发">
        <h3>洪发</h3>
        <p>首席技术官 (CTO)</p>
      </div>

      <!-- 李承宇 -->
      <div class="team-member" data-tilt>
        <img src="images/lichengyu.gif" alt="李承宇">
        <h3>李承宇</h3>
        <p>AI研究总监</p>
      </div>

      <!-- 杨洋 -->
      <div class="team-member" data-tilt>
        <img src="images/yangyang.gif" alt="杨洋">
        <h3>杨洋</h3>
        <p>云计算架构师</p>
      </div>

      <!-- 马伟龙 -->
      <div class="team-member" data-tilt>
        <img src="images/maweilong.gif" alt="马伟龙">
        <h3>马伟龙</h3>
        <p>大数据专家</p>
      </div>

      <!-- 胡开斌 -->
      <div class="team-member" data-tilt>
        <img src="images/hukaibin.gif" alt="胡开斌">
        <h3>胡开斌</h3>
        <p>智能制造负责人</p>
      </div>

      <!-- 徐步伐 -->
      <div class="team-member" data-tilt>
        <img src="images/xubufa.gif" alt="徐步伐">
        <h3>徐步伐</h3>
        <p>产品总监</p>
      </div>

      <!-- 刘金纹 -->
      <div class="team-member" data-tilt>
        <img src="images/liujinwen.gif" alt="刘金纹">
        <h3>刘金纹</h3>
        <p>市场总监</p>
      </div>

      <!-- 张紫京 -->
      <div class="team-member" data-tilt>
        <img src="images/zhangzijin.gif" alt="张紫京">
        <h3>张紫京</h3>
        <p>工程造价专家</p>
      </div>
    </div>
  </div>

  <!-- 页脚 -->
  <footer class="footer">
    <p>© 2025 星之声科技有限公司 | 汇聚顶尖人才，驱动科技未来</p>
  </footer>

  <!-- 脚本 -->
  <script>
    // 粒子背景
    particlesJS("particles-js", {
      particles: {
        number: { value: 80 },
        color: { value: ["#00d4ff", "#7b00ff", "#00ff9d"] },
        shape: { type: "circle" },
        opacity: { value: 0.6, random: true },
        size: { value: 2, random: true },
        line_linked: { enable: true, distance: 120, color: "#00d4ff", opacity: 0.25, width: 1 },
        move: { enable: true, speed: 1.5 }
      },
      interactivity: { events: { onhover: { enable: true, mode: "repulse" } } },
      retina_detect: true
    });

    // 3D 倾斜（修复 typo）
    VanillaTilt.init(document.querySelectorAll("[data-tilt]"), {
      max: 12,
      speed: 400,
      glare: true,
      "max-glare": 0.3
    });

    // 滚动渐入
    const members = document.querySelectorAll('.team-member');
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
        }
      });
    }, { threshold: 0.1 });
    members.forEach(member => observer.observe(member));
  </script>
</body>
</html>
